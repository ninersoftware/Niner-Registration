<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'General-Sans';
            src: url('../fonts/GeneralSans-Regular.woff');
            font-weight: 400;
        }
        @font-face {
            font-family: 'General-Sans';
            src: url('../fonts/GeneralSans-Medium.woff');
            font-weight: 500;
        }
        @font-face {
            font-family: 'General-Sans';
            src: url('../fonts/GeneralSans-Semibold.woff');
            font-weight: 600;
        }
        @font-face {
            font-family: 'General-Sans';
            src: url('../fonts/GeneralSans-Bold.woff');
            font-weight: 700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 320px;
            min-height: 230px;
            font-family: 'General-Sans', sans-serif;
            background: #046A38;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ── HEADER ───────────────────────────────────── */

        .popup-header {
            background: #046A38;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .popup-logo {
            height: 32px;
            width: auto;
            display: block;
            image-rendering: -webkit-optimize-contrast;
        }

        .popup-logo-placeholder {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .popup-version {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.45);
        }

        /* ── TABS ─────────────────────────────────────── */

        .popup-tabs {
            display: flex;
            padding: 0 16px;
            gap: 0;
            background: #046A38;
        }

        .popup-tab {
            padding: 8px 14px 10px 14px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            font-family: 'General-Sans', sans-serif;
            letter-spacing: -0.01em;
        }

        .popup-tab.active {
            color: #ffffff;
            border-bottom-color: #ffffff;
        }

        .popup-tab:hover:not(.active) {
            color: rgba(255,255,255,0.8);
        }

        /* ── TAB CONTENT ──────────────────────────────── */

        .tab-content {
            display: none;
            padding: 14px 16px;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        /* ── CALENDAR TAB ─────────────────────────────── */

        .cal-empty {
            font-size: 11px;
            color: rgba(255,255,255,0.55);
            font-style: italic;
            text-align: center;
            padding: 28px 0;
            line-height: 1.5;
        }

        .cal-course-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .cal-course-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 6px;
            transition: all 0.15s;
        }

        .cal-course-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .cal-course-name {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
        }

        .cal-course-time {
            font-size: 10px;
            font-weight: 500;
            color: rgba(255,255,255,0.65);
        }

        .cal-remove {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255,255,255,0.35);
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .cal-remove:hover {
            color: #cc2222;
            background: rgba(204,34,34,0.06);
        }

        .cal-actions {
            display: flex;
            gap: 6px;
        }

        .cal-btn {
            flex: 1;
            padding: 8px 0;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }

        .cal-btn-clear {
            background: white;
            color: #e07070;
        }

        .cal-btn-clear:hover {
            background: #D3D3D3;
        }

        .cal-btn-export {
            background: #e8841a;
            color: #ffffff;
        }

        .cal-btn-export:hover {
            background: #d47615;
        }

        /* ── SETTINGS TAB ─────────────────────────────── */

        #tab-settings {
            background: #046A38;
            gap: 14px;
            flex: 1;
        }



        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .settings-group-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
        }

        .theme-options {
            display: flex;
            gap: 6px;
        }

        .theme-swatch {
            flex: 1;
            height: 28px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
        }

        .theme-swatch-white { background: #ffffff; border-color: rgba(255,255,255,0.5); }
        .theme-swatch-dark  { background: #000000; border-color: rgba(255,255,255,0.25); }
        .theme-swatch-green { background: #035a2f; border-color: rgba(255,255,255,0.35); }

        .theme-swatch-white.active-white {
            box-shadow: 0 0 0 2px #046A38, 0 0 0 4px #ffffff;
        }

        .theme-swatch-dark.active-dark {
            box-shadow: 0 0 0 2px #046A38, 0 0 0 4px rgba(255,255,255,0.85);
        }

        .theme-swatch-green.active-green {
            box-shadow: 0 0 0 2px #046A38, 0 0 0 4px rgba(255,255,255,0.85);
        }

        /* ── FOOTER ───────────────────────────────────── */

        .popup-footer {
            padding: 8px 16px 12px 16px;
            font-size: 9px;
            font-style: italic;
            color: rgba(255,255,255,0.3);
            text-align: right;
            background: #046A38;
            margin-top: auto;
        }


    </style>
</head>
<body>
    <div class="popup-header">
        <img class="popup-logo" src="../icons/logo2x.png" alt="Niner Registration">
        <span class="popup-version">v2.0</span>
    </div>

    <div class="popup-tabs">
        <button class="popup-tab active" data-tab="calendar">Calendar</button>
        <button class="popup-tab" data-tab="settings">Settings</button>
    </div>

    <div class="tab-content active" id="tab-calendar">
        <div id="cal-list-container">
            <p class="cal-empty">No courses added yet.<br>Hover over a professor to add a course.</p>
        </div>
        <div class="cal-actions" id="cal-actions" style="display:none;">
            <button class="cal-btn cal-btn-clear" id="cal-clear">Clear All</button>
            <button class="cal-btn cal-btn-export" id="cal-export">Export .ics</button>
        </div>
    </div>

    <div class="tab-content" id="tab-settings">
        <div class="settings-group">
            <div class="settings-group-label">Modal Theme</div>
            <div class="theme-options">
                <button class="theme-swatch theme-swatch-white" data-theme="white"></button>
                <button class="theme-swatch theme-swatch-dark" data-theme="dark"></button>
                <button class="theme-swatch theme-swatch-green" data-theme="green"></button>
            </div>
        </div>
    </div>

    <div class="popup-footer">© 2026 ninersoftware</div>

    <script src="popup.js"></script>
</body>
</html>
