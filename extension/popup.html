<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
        font-family: 'General-Sans';
        src: url(chrome-extension://__MSG_@@extension_id__/fonts/GeneralSans-Regular.woff);
        font-weight: 400;
        }
        @font-face {
            font-family: 'General-Sans';
            src: url(chrome-extension://__MSG_@@extension_id__/fonts/GeneralSans-Medium.woff);
            font-weight: 500;
        }
        @font-face {
            font-family: 'General-Sans';
            src: url(chrome-extension://__MSG_@@extension_id__/fonts/GeneralSans-Semibold.woff);
            font-weight: 600;
        }
        @font-face {
            font-family: 'General-Sans';
            src: url(chrome-extension://__MSG_@@extension_id__/fonts/GeneralSans-Bold.woff);
            font-weight: 700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 320px;
            font-family: 'General-Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #101820;
            display: flex;
            flex-direction: column;
        }

        .popup-header {
            padding: 16px 16px 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .popup-logo {
            font-size: 14px;
            font-weight: 700;
            color: #046A38;
        }

        .popup-title {
            font-size: 13px;
            font-weight: 700;
            color: #046A38;
            letter-spacing: -0.01em;
        }

        .popup-version {
            font-size: 10px;
            font-weight: 500;
            color: rgba(0,0,0,0.25);
            margin-left: auto;
        }

        .popup-tabs {
            display: flex;
            padding: 12px 16px 0 16px;
            gap: 4px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            margin-top: 8px;
        }

        .popup-tab {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(0,0,0,0.4);
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.15s;
            font-family: inherit;
        }

        .popup-tab.active {
            color: #046A38;
            border-bottom-color: #046A38;
        }

        .popup-tab:hover:not(.active) {
            color: rgba(0,0,0,0.7);
        }

        .tab-content {
            display: none;
            padding: 14px 16px;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        #tab-settings {
            background: #ffffff !important;
            color: #101820 !important;
        }

        .cal-empty {
            font-size: 11px;
            color: rgba(0,0,0,0.4);
            font-style: italic;
            text-align: center;
            padding: 30px 0;
            line-height: 1.4;
        }

        .cal-course-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .cal-course-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: #f6fbf8;
            border: 1px solid rgba(4,106,56,0.12);
            border-radius: 6px;
            transition: all 0.15s;
        }

        .cal-course-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .cal-course-name {
            font-size: 12px;
            font-weight: 700;
            color: #046A38;
        }

        .cal-course-time {
            font-size: 10px;
            font-weight: 500;
            color: rgba(0,0,0,0.45);
        }

        .cal-remove {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(0,0,0,0.25);
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .cal-remove:hover {
            color: #de2d26;
            background: rgba(222,45,38,0.06);
        }

        .cal-actions {
            display: flex;
            gap: 6px;
        }

        .cal-btn {
            flex: 1;
            padding: 8px 0;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }

        .cal-btn-clear {
            background: rgba(0,0,0,0.05);
            color: rgba(0,0,0,0.5);
        }

        .cal-btn-clear:hover {
            background: rgba(0,0,0,0.08);
            color: rgba(0,0,0,0.8);
        }

        .cal-btn-export {
            background: #046A38;
            color: white;
        }

        .cal-btn-export:hover {
            background: #035a2f;
        }

        .settings-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .settings-group-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(0,0,0,0.4);
        }

        .theme-options {
            display: flex;
            gap: 6px;
        }

        .theme-swatch {
            flex: 1;
            height: 28px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
        }

        .theme-swatch-white { background: #ffffff; border-color: rgba(0,0,0,0.12); }
        .theme-swatch-dark  { background: #101820; }
        .theme-swatch-green { background: #046A38; }


        .theme-swatch-white.active-white {
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #046A38;
        }

        .theme-swatch-dark.active-dark {
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #101820;
        }

        .theme-swatch-green.active-green {
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #046A38;
        }

        body.theme-dark #tab-calendar { background: #101820; color: #ffffff; }
        body.theme-dark #tab-calendar .cal-empty { color: rgba(255,255,255,0.4); }
        body.theme-dark #tab-calendar .cal-course-item { background: #1e2a35; border-color: rgba(255,255,255,0.08); }
        body.theme-dark #tab-calendar .cal-course-name { color: #ffffff; }
        body.theme-dark #tab-calendar .cal-course-time { color: rgba(255,255,255,0.5); }
        body.theme-dark #tab-calendar .cal-btn-clear { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
        body.theme-dark #tab-calendar .cal-btn-clear:hover { background: rgba(255,255,255,0.12); color: #ffffff; }

        body.theme-green #tab-calendar { background: #046A38; color: #ffffff; }
        body.theme-green #tab-calendar .cal-empty { color: rgba(255,255,255,0.5); }
        body.theme-green #tab-calendar .cal-course-item { background: #035a2f; border-color: rgba(255,255,255,0.1); }
        body.theme-green #tab-calendar .cal-course-name { color: #ffffff; }
        body.theme-green #tab-calendar .cal-course-time { color: rgba(255,255,255,0.6); }
        body.theme-green #tab-calendar .cal-btn-clear { background: rgba(255,255,255,0.12); color: #ffffff; }
        body.theme-green #tab-calendar .cal-btn-clear:hover { background: rgba(255,255,255,0.2); }
        body.theme-green #tab-calendar .cal-btn-export { background: #ffffff; color: #046A38; }
        body.theme-green #tab-calendar .cal-btn-export:hover { background: rgba(255,255,255,0.9); }

        .popup-footer {
            padding: 10px 16px 14px 16px;
            border-top: 1px solid rgba(0,0,0,0.04);
            font-size: 9px;
            font-style: italic;
            color: rgba(0,0,0,0.2);
            text-align: right;
            background: #ffffff;
        }
    </style>
</head>
<body class="theme-white">
    <div class="popup-header">
        <span class="popup-title">Niner Registration</span>
        <span class="popup-version">v2.0</span>
    </div>

    <div class="popup-tabs">
        <button class="popup-tab active" data-tab="calendar">Calendar</button>
        <button class="popup-tab" data-tab="settings">Settings</button>
    </div>

    <div class="tab-content active" id="tab-calendar">
        <div id="cal-list-container">
            <p class="cal-empty">No courses added yet. Hover over a professor to add a course.</p>
        </div>
        <div class="cal-actions" id="cal-actions" style="display:none;">
            <button class="cal-btn cal-btn-clear" id="cal-clear">Clear All</button>
            <button class="cal-btn cal-btn-export" id="cal-export">Export .ics</button>
        </div>
    </div>

    <div class="tab-content" id="tab-settings">
        <div class="settings-section">
            <div class="settings-group">
                <div class="settings-group-label">Themes (reload after selecting)</div>
                <div class="theme-options">
                    <button class="theme-swatch theme-swatch-white" data-theme="white"></button>
                    <button class="theme-swatch theme-swatch-dark" data-theme="dark"></button>
                    <button class="theme-swatch theme-swatch-green" data-theme="green"></button>
                </div>
            </div>
        </div>
    </div>

    <div class="popup-footer">© 2026 ninersoftware</div>

    <script src="popup.js"></script>
</body>
</html>
